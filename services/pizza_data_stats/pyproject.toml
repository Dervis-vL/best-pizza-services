[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "pizza-data-stats"
version = "0.1.0"
description = "Aggregations over the rankings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pizza-platform-shared",
]

[tool.uv.sources]
pizza-platform-shared = { workspace = true }

[tool.deptry]
per_rule_ignores = { DEP003 = ["pizza_data_stats", "pizza_platform_shared"] }

[tool.bumpversion]
current_version = "0.1.0"
commit          = true
tag             = true
tag_name        = "pizza-data-stats/v{new_version}"
tag_message     = "Release pizza-data-stats {new_version}"
message         = "chore(pizza-data-stats): bump {current_version} → {new_version}"
commit_args     = "--no-verify"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search   = 'version = "{current_version}"'
replace  = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search   = "## [Unreleased]"
replace  = "## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "release_scope.env"
search   = "RELEASE=(patch|minor|major)"
replace  = "RELEASE=placeholder"
regex    = true
