exclude: \.env(\..+)?$
default_install_hook_types: [pre-commit, pre-push]

repos:
  # File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
    -   id: check-lock
        name: check-lock
        entry: uv run --no-sync just check-lock
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false
    -   id: fix
        name: fix
        entry: uv run --no-sync just fix
        language: system
        types: [python]
        pass_filenames: false
    -   id: check-release
        name: check-release
        entry: uv run --no-sync just check-release
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  # Gitleaks: blocks secrets before they reach a commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Without always_run, the top-level .env exclude empties this hook's file
        # list and prek skips it -- on exactly the commit that force-adds a .env.
        always_run: true

  # Codespell: catches typos
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
